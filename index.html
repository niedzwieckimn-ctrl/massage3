<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Massages & SPA — rezerwacja wizyty">
  <meta name="theme-color" content="#ffffff">
  <title>Massages &amp; SPA — Rezerwacja</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-client.js"></script>
</head>
<body>
  <a href="https://www.massagesandspa.pl" class="back-home">← Powrót</a>
  <div class="container">
    <div class="header"><div class="brand"><img class="logo" alt="Massages & SPA" src="assets/logo.svg"></div></div>
    <div class="card">
      <h2>Rezerwacja Online</h2>
      <form class="grid two" id="form">
        <div><label for="name">Imię i nazwisko *</label><input class="input" id="name" maxlength="120" autocomplete="name" required></div>
        <div><label for="email">Email *</label><input class="input" id="email" maxlength="254" autocomplete="email" required type="email"></div>
        <div><label for="phone">Telefon *</label><input class="input" id="phone" maxlength="40" autocomplete="tel" required type="tel"></div>
        <div><label for="address">Adres *</label><input class="input" id="address" maxlength="500" autocomplete="street-address" placeholder="Ulica, numer, miasto" required></div>
        <div><label for="service">Zabieg *</label><select class="input" id="service" required><option value="">Ładowanie…</option></select></div>
        <div><label for="date">Data *</label><input class="input" id="date" required type="text" readonly></div>
        <div class="calendar-note">Rezerwacja min. 48h wcześniej. <span class="short-notice-legend">Pomarańczowe dni: terminy last minute.</span></div>
        <div><label for="time">Godzina *</label><select class="input" id="time" required disabled><option value="">Wybierz datę…</option></select></div>
        <div class="grid" style="grid-column:1/-1"><label for="notes">Uwagi</label><textarea class="input" id="notes" maxlength="2000" placeholder="Np. preferencje, dolegliwości…" rows="4"></textarea></div>
        <div class="inline" style="grid-column:1/-1"><input id="rodo" style="width:18px;height:18px" type="checkbox" required><label for="rodo" id="rodoLbl">Wyrażam zgodę na przetwarzanie danych osobowych w celu realizacji rezerwacji.</label></div>
        <div style="grid-column:1/-1;display:flex;gap:10px"><button id="submit-booking" class="btn" type="submit">Rezerwuj</button></div>
      </form>
    </div>
    <div class="footer">© Massages &amp; SPA • <span id="contact">massages.n.spa@gmail.com • 729 979 396</span></div>
  </div>
  <div id="bookingThanks" hidden><div class="line1">Dziękujemy za rezerwację!</div><div class="line2">Poczekaj na jej potwierdzenie.</div></div>
  <script src="assets/app.js"></script>
  <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(console.warn);</script>
</body>
</html>
